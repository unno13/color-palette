<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラーパレットコレクション</title>

  <!-- ファビコン -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kiwi+Maru:wght@400;500;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kiwi+Maru:wght@400;500;700&display=swap">
  </noscript>
 
  <!-- 表示に必要なデータを他のリソースと並行して早めに取得開始 -->
  <link rel="preload" href="data.json" as="fetch" crossorigin>
 
  <!-- 構造用CSS -->
  <link rel="stylesheet" href="style.css">
 
  <!-- データとロジックは別ファイルに分離。deferにより他のリソースと並行してダウンロードしつつ、実行はDOM構築後 -->
  <script src="app.js" defer></script>
</head>
<body>

  <header>
    <h1>* Color Palette Collection *</h1>
    <p>クリックでカラーコードをコピーできます</p>
  </header>

  <!-- タブボタン（app.js が data.json から自動生成） -->
  <div class="tab-container" id="tab-container"></div>

  <main id="main-content">
    <p class="loading-msg">読み込み中...</p>
  </main>

  <!-- 画面下部のタブ（上部と連動） -->
  <div class="tab-container tab-container-bottom" id="tab-container-bottom"></div>

  <footer>
    <p>&copy; unno13 / Color Palette Collection</p>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- データとロジックは別ファイルに分離 -->
  <script src="app.js"></script>

</body>
</html>
