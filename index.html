<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラーパレットギャラリー</title>

  <!-- ファビコン -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Font Awesome (Webアイコン) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 構造用CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>* Color Palette Collection *</h1>
    <p>クリックでカラーコードをコピーできます</p>
  </header>

  <!-- タブボタン（app.js が data.json から自動生成） -->
  <div class="tab-container" id="tab-container"></div>

  <main id="main-content">
    <p class="loading-msg">読み込み中...</p>
  </main>

  <footer>
    <p>&copy; Color Palette Gallery</p>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- データとロジックは別ファイルに分離 -->
  <script src="app.js"></script>

</body>
</html>
